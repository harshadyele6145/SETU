version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: setu-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: setu_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d setu_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: setu-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/setu_db
      SECRET_KEY: setu-docker-production-secret-key-min-32-chars-long
      DEMO_MODE: "true"
      DEFAULT_TIMEZONE: Asia/Kolkata
      CORS_ORIGINS: http://localhost,http://localhost:5173,http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - storage_data:/app/backend/storage/uploads
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m backend.seed.seed_data &&
             uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: setu-frontend
    ports:
      - "5173:80"
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  storage_data:
